# Deploy:
#   docker compose -f docker-compose.prod.yml --env-file .env.production pull
#   docker compose -f docker-compose.prod.yml --env-file .env.production up -d
# Apply schema migrations (after first boot or after schema changes):
#   docker compose -f docker-compose.prod.yml --env-file .env.production exec app node scripts/migrate.mjs
#
# The app image is built off-VPS by GitHub Actions (.github/workflows/build.yml)
# and published to GHCR. Set APP_IMAGE in .env.production to the GHCR path,
# pinning either `:latest` or a specific commit SHA for rollbacks.


services:
  app:
    image: ${APP_IMAGE}
    restart: unless-stopped
    env_file:
      - .env.production
    expose:
      - "3000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - notegarden-net
    security_opt:
      - no-new-privileges:true

  caddy:
    image: caddy:2-alpine
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"   # HTTP/3
    environment:
      DOMAIN: ${DOMAIN}
      ACME_EMAIL: ${ACME_EMAIL}
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data       # LE certs + ACME state — back this up
      - caddy-config:/config
    depends_on:
      - app
    networks:
      - notegarden-net
    security_opt:
      - no-new-privileges:true

  db:
    image: postgres:16.6-alpine
    restart: unless-stopped
    # Postgres image initializes the user/db on first boot from these vars.
    # Keep them in sync with the credentials embedded in DATABASE_URL.
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - notegarden-pgdata:/var/lib/postgresql/data
    networks:
      - notegarden-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s
    security_opt:
      - no-new-privileges:true

  # Lightweight cron container — reuses the postgres-alpine image so it has
  # psql, pg_dump, and gzip available.
  # Schedules use UTC. Adjust via TZ if you want local-time scheduling.
  cron:
    image: postgres:16.6-alpine
    restart: unless-stopped
    depends_on:
      db:
        condition: service_healthy
    environment:
      PGHOST: db
      PGUSER: ${POSTGRES_USER}
      PGPASSWORD: ${POSTGRES_PASSWORD}
      PGDATABASE: ${POSTGRES_DB}
      BACKUP_RETENTION_DAYS: ${BACKUP_RETENTION_DAYS:-7}
    volumes:
      - ./scripts/cron-tasks.sh:/cron-tasks.sh:ro
      - notegarden-backups:/backups
    networks:
      - notegarden-net
    # Inline crontab + run busybox crond in the foreground.
    # Per-job output redirected to PID 1's stdout so docker logs captures it.
    command:
      - sh
      - -c
      - |
        chmod +x /cron-tasks.sh
        cat > /etc/crontabs/root <<'EOF'
        0 2 * * * /cron-tasks.sh gc-sync-request >> /proc/1/fd/1 2>&1
        0 3 * * * /cron-tasks.sh backup-db >> /proc/1/fd/1 2>&1
        EOF
        exec crond -f -l 2 -L /dev/stdout
    security_opt:
      - no-new-privileges:true

networks:
  notegarden-net:
    driver: bridge

volumes:
  notegarden-pgdata:
  notegarden-backups:
  caddy-data:
  caddy-config:
