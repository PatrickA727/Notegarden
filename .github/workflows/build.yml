name: Build and push image

# Builds the app's Docker image on every push to main and publishes it to
# GitHub Container Registry. The VPS pulls from GHCR — deploy is just
# `docker compose pull && docker compose up -d` over there.
#
# workflow_dispatch is enabled so you can rebuild without a code change
# (useful when the upstream node:24-alpine base image gets a security update).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/repo, lowercased by docker/metadata-action

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      packages: write      # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags every build with the full commit SHA (immutable, used for rollbacks)
      # and also moves the `latest` tag to the newest build on main.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # NEXT_PUBLIC_BETTER_AUTH_URL is inlined into the client JS bundle at
      # build time, so it must be passed as a build-arg. It's not a secret —
      # it ships in the public bundle anyway — so it's stored as a repository
      # **variable** (Settings → Secrets and variables → Actions → Variables),
      # not a secret.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
