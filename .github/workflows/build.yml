name: Test, build, and push image

# Two-stage pipeline on every push to main:
#   1. test  — Vitest suite against an ephemeral Postgres service container.
#   2. build — only runs if test passed; builds the Docker image and pushes
#              to GHCR with tags :latest and :<full-sha>.
#
# Tests block the image push, so a broken endpoint can never reach the VPS.
# workflow_dispatch is enabled so you can rebuild without a code change
# (useful when the upstream node:24-alpine base image gets a security update).

on:
  push:
    branches: [main]
  workflow_dispatch:

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}   # owner/repo, lowercased by docker/metadata-action

jobs:
  test:
    runs-on: ubuntu-latest

    # Ephemeral Postgres for the test suite. Container is destroyed when
    # the job ends — no cleanup needed. Healthcheck gates job start.
    services:
      postgres:
        image: postgres:16.6-alpine
        env:
          POSTGRES_USER: test
          POSTGRES_PASSWORD: test
          POSTGRES_DB: notegarden_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: 'npm'

      - run: npm ci --no-audit --no-fund

      # Materialise the .env.test the test scripts expect. Auth vars are
      # dummies because tests/setup.ts mocks lib/session — the real auth code
      # is never executed. DB creds match the postgres service container.
      - name: Create .env.test
        run: |
          cat > .env.test <<'EOF'
          DATABASE_URL=postgres://test:test@localhost:5432/notegarden_test
          DATABASE_SSL=false
          BETTER_AUTH_SECRET=dummy-ci-secret-not-used
          NEXT_PUBLIC_BETTER_AUTH_URL=http://localhost:3000
          GOOGLE_CLIENT_ID=dummy
          GOOGLE_CLIENT_SECRET=dummy
          EOF

      - name: Push schema to test DB
        run: npm run db:push:test

      - name: Run Vitest
        run: npm test

  build:
    needs: test           # blocks image push until tests pass
    runs-on: ubuntu-latest
    permissions:
      contents: read       # checkout
      packages: write      # push to GHCR

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # Tags every build with the full commit SHA (immutable, used for rollbacks)
      # and also moves the `latest` tag to the newest build on main.
      - name: Extract image metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=sha,format=long
            type=raw,value=latest,enable={{is_default_branch}}

      # NEXT_PUBLIC_BETTER_AUTH_URL is inlined into the client JS bundle at
      # build time, so it must be passed as a build-arg. It's not a secret —
      # it ships in the public bundle anyway — so it's stored as a repository
      # **variable** (Settings → Secrets and variables → Actions → Variables),
      # not a secret.
      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            NEXT_PUBLIC_BETTER_AUTH_URL=${{ vars.NEXT_PUBLIC_BETTER_AUTH_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
